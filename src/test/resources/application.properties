spring.application.name=backend

app.security.jwt.secret=ZnJhc2VzbGFyZ2FzcGFyYWNvbG9jYXJjb21vY2xhdmVlbnVucHJvamVjdG9kZWVtZXBsb3BhcmFqd3Rjb25zcHJpbmdzZWN1cml0eQ==bWlwcnVlYmFkZWVqbXBsb3BhcmFiYXNlNjQ=

# Activamos el perfil "test" automaticamente para todos los tests
# Esto carga SecurityTestConfig (permitAll) y desactiva WebSecurityConfig (que es @Profile("default"))
spring.profiles.active=test

# Base de datos en memoria H2 (no requiere MySQL externo)
# NON_KEYWORDS=USER porque la entidad User mapea a la tabla "user", que en H2 es palabra reservada
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate: crea/borra el esquema en cada arranque del contexto
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Permite que TestDataInitializer y otros beans sobreescriban definiciones
spring.main.allow-bean-definition-overriding=true

# Bajamos el ruido del log durante tests
logging.level.org.springframework.web=warn
logging.level.org.springframework.security=warn
logging.level.org.hibernate=warn
logging.level.com.duoc=info
